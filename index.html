<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>note メンバーズコミュニティ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgMain: '#F9F9FB',
            sidebarBg: '#FFFFFF',
            cardBg: '#FFFFFF',
            textMain: '#1A1A1E',
            textSub: '#71717A',
            borderSoft: '#E4E4E7',
            accent: '#18181B',
            accentBlue: '#2563EB',
            badgeBg: '#EFF6FF'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F9F9FB;
      color: #1A1A1E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 4px; }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ADMIN_PASSWORD = 'meimei2525';

    const DEFAULT_CHANNELS = [
      { id: 'announcement', name: '📢-お知らせ', desc: '管理者からの更新情報・連絡事項' },
      { id: 'general', name: '💬-雑談ルーム', desc: '誰でも気軽に話せるメインの部屋' },
      { id: 'note-feedback', name: '📝-記事の感想・リクエスト', desc: 'note記事の感想や取り上げてほしいテーマ' },
      { id: 'self-intro', name: '👋-自己紹介', desc: 'はじめましての挨拶はこちらへ' }
    ];

    function App() {
      // ユーザー情報（デフォルト名）
      const [currentUser, setCurrentUser] = useState(() => {
        const savedName = localStorage.getItem('community_user_name');
        return {
          id: 'user_' + (localStorage.getItem('community_user_id') || Date.now()),
          name: savedName || 'ゲストメンバー',
          isAdmin: false
        };
      });

      const [channels, setChannels] = useState(DEFAULT_CHANNELS);
      const [activeChannelId, setActiveChannelId] = useState('general');
      const [messages, setMessages] = useState({});
      const [inputText, setInputText] = useState('');
      const [reactions, setReactions] = useState({});
      
      // UI状態
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [notification, setNotification] = useState(null);
      const [viewingProfile, setViewingProfile] = useState(null);
      const [bannedUsers, setBannedUsers] = useState([]);
      const [newChannelName, setNewChannelName] = useState('');
      const [isAddingChannel, setIsAddingChannel] = useState(false);
      
      // 管理者認証モーダル
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [inputPassword, setInputPassword] = useState('');
      const [passwordError, setPasswordError] = useState(false);

      // ★ 名前変更モーダル
      const [showNameModal, setShowNameModal] = useState(false);
      const [editNameInput, setEditNameInput] = useState('');

      const messagesEndRef = useRef(null);

      // 初期IDの保持
      useEffect(() => {
        if (!localStorage.getItem('community_user_id')) {
          localStorage.setItem('community_user_id', currentUser.id.replace('user_', ''));
        }
      }, []);

      // ローカルストレージ読込
      useEffect(() => {
        const savedCh = localStorage.getItem('community_channels');
        if (savedCh) setChannels(JSON.parse(savedCh));
        
        const savedMsg = localStorage.getItem('community_messages');
        if (savedMsg) setMessages(JSON.parse(savedMsg));
      }, []);

      // 自動保存
      useEffect(() => {
        localStorage.setItem('community_channels', JSON.stringify(channels));
      }, [channels]);

      useEffect(() => {
        localStorage.setItem('community_messages', JSON.stringify(messages));
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // ユーザー名の保存
      useEffect(() => {
        localStorage.setItem('community_user_name', currentUser.name);
      }, [currentUser.name]);

      // 名前変更モーダルを開く
      function handleOpenNameModal() {
        setEditNameInput(currentUser.name);
        setShowNameModal(true);
      }

      // 名前保存処理
      function handleSaveName(e) {
        e.preventDefault();
        const trimmed = editNameInput.trim();
        if (!trimmed) return;

        setCurrentUser(prev => ({ ...prev, name: trimmed }));
        setShowNameModal(false);
      }

      function triggerMentionNotification(senderName, text) {
        setNotification({ sender: senderName, text: text });
        setTimeout(() => setNotification(null), 4000);
      }

      function handleToggleAdmin() {
        if (currentUser.isAdmin) {
          const savedName = localStorage.getItem('community_user_name') || 'ゲストメンバー';
          setCurrentUser({ ...currentUser, name: savedName, isAdmin: false });
        } else {
          setInputPassword('');
          setPasswordError(false);
          setShowPasswordModal(true);
        }
      }

      function handleVerifyPassword(e) {
        e.preventDefault();
        if (inputPassword === ADMIN_PASSWORD) {
          setCurrentUser({ id: 'owner_01', name: '管理者（あなた）', isAdmin: true });
          setShowPasswordModal(false);
          setInputPassword('');
          setPasswordError(false);
        } else {
          setPasswordError(true);
        }
      }

      function handleSendMessage(e) {
        e.preventDefault();
        if (!inputText.trim() || bannedUsers.includes(currentUser.id)) return;

        const newMsg = {
          id: Date.now().toString(),
          channelId: activeChannelId,
          userId: currentUser.id,
          userName: currentUser.name,
          isAdmin: currentUser.isAdmin,
          content: inputText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => ({
          ...prev,
          [activeChannelId]: [...(prev[activeChannelId] || []), newMsg]
        }));

        if (inputText.includes(`@${currentUser.name}`)) {
          triggerMentionNotification(currentUser.name, inputText);
        }

        setInputText('');
      }

      function handleAddChannel() {
        if (!newChannelName.trim()) return;
        const newCh = {
          id: 'ch_' + Date.now(),
          name: '#' + newChannelName.replace(/\s+/g, '-'),
          desc: '新しいチャンネル'
        };
        setChannels([...channels, newCh]);
        setNewChannelName('');
        setIsAddingChannel(false);
      }

      function handleDeleteChannel(chId) {
        if (!currentUser.isAdmin) return;
        if (confirm('このチャンネルを削除しますか？')) {
          setChannels(channels.filter(c => c.id !== chId));
          if (activeChannelId === chId) setActiveChannelId('general');
        }
      }

      function handleDeleteMessage(msgId) {
        if (!currentUser.isAdmin) return;
        if (confirm('このメッセージを削除しますか？（管理者権限）')) {
          setMessages(prev => ({
            ...prev,
            [activeChannelId]: prev[activeChannelId].filter(m => m.id !== msgId)
          }));
        }
      }

      function handleBanUser(targetUserId) {
        if (!currentUser.isAdmin) return;
        if (confirm('このユーザーをコミュニティから追放（BAN）しますか？')) {
          setBannedUsers([...bannedUsers, targetUserId]);
          setViewingProfile(null);
          alert('ユーザーを追放しました。');
        }
      }

      function handleReaction(msgId, symbol) {
        setReactions(prev => {
          const current = prev[msgId] || {};
          const count = current[symbol] || 0;
          return { ...prev, [msgId]: { ...current, [symbol]: count + 1 } };
        });
      }

      const activeChannel = channels.find(c => c.id === activeChannelId) || channels[0];
      const currentChannelMessages = messages[activeChannelId] || [];

      return (
        <div className="flex h-full relative">
          
          {/* 通知バナー */}
          {notification && (
            <div className="absolute top-3 left-1/2 -translate-x-1/2 bg-accent text-white px-4 py-2.5 rounded-full shadow-lg z-50 flex items-center gap-2 text-xs font-bold animate-bounce">
              <span className="bg-blue-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px]">🔔</span>
              <span><strong>@{notification.sender}</strong> さんからメンションが届きました！</span>
            </div>
          )}

          {/* モバイル用背景オーバーレイ */}
          {isSidebarOpen && (
            <div onClick={() => setIsSidebarOpen(false)} className="fixed inset-0 bg-black/30 z-20 md:hidden" />
          )}

          {/* ① 左側 チャンネルサイドバー */}
          <aside className={`fixed md:static inset-y-0 left-0 w-64 bg-sidebarBg border-r border-borderSoft z-30 transform transition-transform duration-200 flex flex-col ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
            <div className="p-4 border-b border-borderSoft flex justify-between items-center">
              <div>
                <h1 className="font-bold text-sm text-textMain tracking-tight">note コミュニティ</h1>
                <p className="text-[10px] text-textSub">ステータス: {currentUser.isAdmin ? '👑 管理者' : '👤 一般メンバー'}</p>
              </div>
              <button
                onClick={handleToggleAdmin}
                className={`text-[9px] px-2 py-1 border rounded font-bold transition ${currentUser.isAdmin ? 'bg-black text-white border-black' : 'bg-bgMain border-borderSoft text-textSub hover:text-textMain'}`}
              >
                {currentUser.isAdmin ? '管理者解除' : '🔒 管理者ログイン'}
              </button>
            </div>

            {/* チャンネルリスト */}
            <div className="flex-1 overflow-y-auto p-2 space-y-1">
              <div className="flex justify-between items-center px-2 py-1 text-[11px] font-bold text-textSub">
                <span>チャンネル一覧</span>
                {currentUser.isAdmin && (
                  <button onClick={() => setIsAddingChannel(true)} className="hover:text-textMain text-xs font-bold">＋</button>
                )}
              </div>

              {isAddingChannel && (
                <div className="p-2 bg-bgMain rounded-lg border border-borderSoft mb-2 space-y-1.5">
                  <input
                    type="text"
                    placeholder="例: 雑談ルーム2"
                    value={newChannelName}
                    onChange={e => setNewChannelName(e.target.value)}
                    className="w-full text-xs p-1.5 border border-borderSoft rounded focus:outline-none"
                  />
                  <div className="flex justify-end gap-1">
                    <button onClick={() => setIsAddingChannel(false)} className="text-[10px] px-2 py-1 text-textSub">中止</button>
                    <button onClick={handleAddChannel} className="text-[10px] px-2 py-1 bg-accent text-white rounded font-bold">追加</button>
                  </div>
                </div>
              )}

              {channels.map(ch => (
                <div
                  key={ch.id}
                  onClick={() => { setActiveChannelId(ch.id); setIsSidebarOpen(false); }}
                  className={`group flex items-center justify-between px-2.5 py-2 rounded-xl cursor-pointer text-xs font-bold transition ${activeChannelId === ch.id ? 'bg-accent text-white' : 'text-textSub hover:bg-bgMain hover:text-textMain'}`}
                >
                  <span className="truncate">{ch.name}</span>
                  {currentUser.isAdmin && channels.length > 1 && (
                    <button onClick={(e) => { e.stopPropagation(); handleDeleteChannel(ch.id); }} className="opacity-0 group-hover:opacity-100 hover:text-red-400 text-xs">×</button>
                  )}
                </div>
              ))}
            </div>

            {/* 下部 自分のユーザー情報 & 名前変更ボタン */}
            <div className="p-3 border-t border-borderSoft bg-bgMain flex items-center justify-between">
              <div className="flex items-center gap-2 overflow-hidden">
                <div className="w-7 h-7 rounded-full bg-accent text-white flex items-center justify-center font-bold text-xs shrink-0">
                  {currentUser.name.substring(0, 1)}
                </div>
                <div className="truncate">
                  <p className="text-xs font-bold text-textMain truncate">{currentUser.name}</p>
                  <p className="text-[9px] text-textSub">{currentUser.isAdmin ? '👑 管理者' : '一般メンバー'}</p>
                </div>
              </div>
              <button
                onClick={handleOpenNameModal}
                title="名前を変更"
                className="text-xs p-1.5 hover:bg-cardBg rounded-lg border border-transparent hover:border-borderSoft text-textSub hover:text-textMain transition shrink-0 font-bold"
              >
                ✏️
              </button>
            </div>
          </aside>

          {/* ② 中央 メインチャット画面 */}
          <main className="flex-1 flex flex-col h-full bg-bgMain">
            <header className="bg-cardBg border-b border-borderSoft px-4 py-3 flex items-center justify-between sticky top-0 z-10">
              <div className="flex items-center gap-3">
                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden text-lg font-bold text-textSub p-1">☰</button>
                <div>
                  <h2 className="text-xs font-bold text-textMain">{activeChannel?.name}</h2>
                  <p className="text-[10px] text-textSub">{activeChannel?.desc}</p>
                </div>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {currentChannelMessages.map(msg => {
                const msgReactions = reactions[msg.id] || {};

                return (
                  <div key={msg.id} className="flex gap-3 group items-start">
                    <div
                      onClick={() => setViewingProfile(msg)}
                      className="w-8 h-8 rounded-full bg-badgeBg border border-borderSoft flex items-center justify-center font-bold text-xs text-accentBlue shrink-0 cursor-pointer hover:border-accentBlue"
                    >
                      {msg.userName.substring(0, 1)}
                    </div>

                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-0.5">
                        <span className="text-xs font-bold text-textMain cursor-pointer hover:underline" onClick={() => setViewingProfile(msg)}>
                          {msg.userName}
                        </span>
                        {msg.isAdmin && <span className="bg-black text-white text-[9px] px-1.5 py-0.5 rounded font-bold">👑 管理者</span>}
                        <span className="text-[10px] text-textSub">{msg.timestamp}</span>
                      </div>

                      <div className="inline-block bg-cardBg border border-borderSoft p-3 rounded-2xl rounded-tl-none text-xs text-textMain leading-relaxed shadow-sm break-words max-w-xl">
                        {msg.content}
                      </div>

                      <div className="flex items-center gap-2 mt-1">
                        <button onClick={() => handleReaction(msg.id, '👍')} className="text-[10px] border border-borderSoft bg-cardBg px-2 py-0.5 rounded-full hover:bg-bgMain">
                          👍 {msgReactions['👍'] || 0}
                        </button>
                        <button onClick={() => handleReaction(msg.id, '❤️')} className="text-[10px] border border-borderSoft bg-cardBg px-2 py-0.5 rounded-full hover:bg-bgMain">
                          ❤️ {msgReactions['❤️'] || 0}
                        </button>
                        <button onClick={() => setInputText(`@${msg.userName} `)} className="text-[10px] text-textSub hover:text-textMain font-bold">
                          返信
                        </button>
                        {currentUser.isAdmin && (
                          <button onClick={() => handleDeleteMessage(msg.id)} className="opacity-0 group-hover:opacity-100 text-[10px] text-red-500 font-bold ml-2">
                            削除
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
              <div ref={messagesEndRef} />
            </div>

            <form onSubmit={handleSendMessage} className="p-3 bg-cardBg border-t border-borderSoft flex gap-2 items-center">
              <input
                type="text"
                placeholder={`${activeChannel?.name} に送信... (@名前 でメンション)`}
                value={inputText}
                onChange={e => setInputText(e.target.value)}
                className="flex-1 bg-bgMain rounded-full px-4 py-2 text-xs border border-borderSoft focus:outline-none focus:border-accent"
              />
              <button
                type="submit"
                disabled={!inputText.trim()}
                className="bg-accent text-white px-4 py-2 rounded-full text-xs font-bold disabled:opacity-30 shrink-0"
              >
                送信
              </button>
            </form>
          </main>

          {/* ★ 名前変更モーダル */}
          {showNameModal && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleSaveName} className="bg-cardBg w-full max-w-xs rounded-2xl p-4 shadow-xl border border-borderSoft space-y-3">
                <div className="flex justify-between items-center border-b border-borderSoft pb-2">
                  <span className="text-xs font-bold text-textMain">✏️ 名前の変更</span>
                  <button type="button" onClick={() => setShowNameModal(false)} className="text-xs font-bold text-textSub">×</button>
                </div>
                <p className="text-[11px] text-textSub">チャット内で表示されるあなたの名前を入力してください。</p>
                
                <input
                  type="text"
                  value={editNameInput}
                  onChange={e => setEditNameInput(e.target.value)}
                  placeholder="例: たろう / note読者"
                  maxLength={20}
                  className="w-full border border-borderSoft p-2 rounded-xl text-xs bg-bgMain focus:outline-none focus:border-accent"
                  autoFocus
                />

                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setShowNameModal(false)}
                    className="flex-1 py-1.5 text-xs font-bold text-textSub bg-bgMain rounded-xl border border-borderSoft"
                  >
                    キャンセル
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-1.5 text-xs font-bold text-white bg-accent rounded-xl shadow-sm"
                  >
                    保存
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* 管理者パスワード入力モーダル */}
          {showPasswordModal && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleVerifyPassword} className="bg-cardBg w-full max-w-xs rounded-2xl p-4 shadow-xl border border-borderSoft space-y-3">
                <div className="flex justify-between items-center border-b border-borderSoft pb-2">
                  <span className="text-xs font-bold text-textMain">🔒 管理者パスワードの入力</span>
                  <button type="button" onClick={() => setShowPasswordModal(false)} className="text-xs font-bold text-textSub">×</button>
                </div>
                <p className="text-[11px] text-textSub">管理者権限を有効にするためのパスワードを入力してください。</p>
                
                <input
                  type="password"
                  value={inputPassword}
                  onChange={e => setInputPassword(e.target.value)}
                  placeholder="パスワード"
                  className="w-full border border-borderSoft p-2 rounded-xl text-xs bg-bgMain focus:outline-none focus:border-accent"
                  autoFocus
                />

                {passwordError && (
                  <p className="text-[10px] text-red-500 font-bold">※ パスワードが違います</p>
                )}

                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setShowPasswordModal(false)}
                    className="flex-1 py-1.5 text-xs font-bold text-textSub bg-bgMain rounded-xl border border-borderSoft"
                  >
                    キャンセル
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-1.5 text-xs font-bold text-white bg-accent rounded-xl shadow-sm"
                  >
                    認証
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* ユーザープロフ ＆ BANダイアログ */}
          {viewingProfile && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
              <div className="bg-cardBg w-full max-w-xs rounded-2xl p-4 shadow-xl border border-borderSoft space-y-3">
                <div className="flex justify-between items-center border-b border-borderSoft pb-2">
                  <span className="text-xs font-bold text-textSub">メンバー詳細</span>
                  <button onClick={() => setViewingProfile(null)} className="text-xs font-bold text-textSub">×</button>
                </div>
                <div className="flex items-center gap-3 pt-1">
                  <div className="w-10 h-10 rounded-full bg-badgeBg border border-borderSoft flex items-center justify-center font-bold text-sm text-accentBlue">
                    {viewingProfile.userName.substring(0, 1)}
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-textMain">{viewingProfile.userName}</h3>
                    <p className="text-[10px] text-textSub">{viewingProfile.isAdmin ? 'コミュニティ管理者' : '一般参加メンバー'}</p>
                  </div>
                </div>

                <div className="space-y-1.5 pt-2 border-t border-borderSoft">
                  <button
                    onClick={() => { setInputText(`@${viewingProfile.userName} `); setViewingProfile(null); }}
                    className="w-full bg-bgMain border border-borderSoft py-2 rounded-xl text-xs font-bold text-textMain"
                  >
                    @ メンションして返信
                  </button>

                  {currentUser.isAdmin && !viewingProfile.isAdmin && (
                    <button
                      onClick={() => handleBanUser(viewingProfile.userId)}
                      className="w-full bg-red-50 text-red-600 border border-red-200 py-2 rounded-xl text-xs font-bold hover:bg-red-100 transition"
                    >
                      👑 このユーザーを追放（BAN）する
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
